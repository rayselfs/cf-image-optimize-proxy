name: CI

on:
  pull_request:
    branches: [main]

env:
  HELM_UNITTEST_VERSION: v1.0.2

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v -cover -race -coverprofile=coverage.out

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"

      - name: Helm lint
        run: |
          helm lint charts/cf-image-optimize-proxy \
            --set config.cacheS3Bucket=cache-bucket \
            --set config.imgproxyURL=http://imgproxy.default.svc.cluster.local \
            --set 'config.allowedUpstreamGateways[0]=images.example.com' \
            --set 'config.allowedSourceBuckets[0]=source-bucket'

      - name: Helm unit tests
        run: helm unittest charts/cf-image-optimize-proxy

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
