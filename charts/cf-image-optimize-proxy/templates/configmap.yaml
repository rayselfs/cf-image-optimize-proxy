apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cf-image-optimize-proxy.fullname" . }}
  labels:
    {{- include "cf-image-optimize-proxy.labels" . | nindent 4 }}
data:
  LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  CACHE_S3_BUCKET: {{ required "config.cacheS3Bucket is required" .Values.config.cacheS3Bucket | quote }}
  CACHE_S3_REGION: {{ .Values.config.cacheS3Region | quote }}
  IMGPROXY_URL: {{ required "config.imgproxyURL is required" .Values.config.imgproxyURL | quote }}
  MAX_WIDTH: {{ .Values.config.maxWidth | toString | quote }}
  UPSTREAM_TIMEOUT: {{ .Values.config.upstreamTimeout | toString | quote }}
  IMGPROXY_TIMEOUT: {{ .Values.config.imgproxyTimeout | toString | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | toString | quote }}
  DEFAULT_QUALITY: {{ .Values.config.defaultQuality | toString | quote }}
  ALLOWED_UPSTREAM_GATEWAYS: {{ required "config.allowedUpstreamGateways must contain at least one host" (join "," .Values.config.allowedUpstreamGateways) | quote }}
  ALLOWED_SOURCE_BUCKETS: {{ required "config.allowedSourceBuckets must contain at least one bucket" (join "," .Values.config.allowedSourceBuckets) | quote }}
  {{- if .Values.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  {{- end }}

