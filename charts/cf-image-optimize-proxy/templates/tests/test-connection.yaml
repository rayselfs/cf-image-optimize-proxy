apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cf-image-optimize-proxy.fullname" . }}-test-connection
  labels:
    {{- include "cf-image-optimize-proxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
      args:
        - -qO-
        - http://{{ include "cf-image-optimize-proxy.fullname" . }}:{{ .Values.service.port }}/health

